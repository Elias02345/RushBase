# Development stack. Always run with the project name "rushbase-dev":
#   docker compose -p rushbase-dev -f dev/docker-compose.dev.yml --env-file dev/data/dev.env up -d
# Credentials come from dev/data/dev.env, generated by `make dev` (never committed).
name: rushbase-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rushbase
      POSTGRES_PASSWORD: ${RUSHBASE_DEV_DB_PASSWORD:?run make dev-up to generate dev/data/dev.env}
      POSTGRES_DB: rushbase
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushbase -d rushbase"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Simulated NAS: exposes ./dev/library as the SMB share "media".
  samba:
    image: dockurr/samba:4.23
    environment:
      NAME: media
      USER: rushbase
      PASS: ${RUSHBASE_DEV_SMB_PASSWORD:?run make dev-up to generate dev/data/dev.env}
      UID: ${RUSHBASE_DEV_UID:-1000}
      GID: ${RUSHBASE_DEV_GID:-1000}
    ports:
      - "127.0.0.1:14450:445"
    volumes:
      - ./library:/storage
    restart: unless-stopped

  # Optional: the server as a container (docker compose --profile server up).
  server:
    profiles: ["server"]
    build:
      context: ..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      RUSHBASE_SECRET_KEY: ${RUSHBASE_SECRET_KEY:?run make dev-up to generate dev/data/dev.env}
      RUSHBASE_DATABASE_URL: postgresql+psycopg://rushbase:${RUSHBASE_DEV_DB_PASSWORD}@postgres:5432/rushbase
      RUSHBASE_HOST: 0.0.0.0
      RUSHBASE_PORT: "8080"
      RUSHBASE_LIBRARY_ROOT: /library
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./library:/library
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
