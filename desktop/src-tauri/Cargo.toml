[package]
name = "rushbase-desktop"
version = "0.9.0-rc.2"
description = "Rushbase companion app: local AI processing and library browsing"
authors = ["Rushbase contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "rushbase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-drag = "=2.1.1"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "=2.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
