[project]
name = "rushbase-server"
version = "0.9.0rc3"
description = "Rushbase coordinator: API, database and web UI host."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "rushbase-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "typer>=0.15",
  "numpy>=2.1",
  "onnxruntime>=1.23",
  "tokenizers>=0.21",
  "mcp==2.3.0",
  "pillow>=11",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
]

[project.scripts]
rushbase-server = "rushbase_server.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rushbase_server"]
