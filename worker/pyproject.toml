[project]
name = "rushbase-worker"
version = "0.1.0"
description = "Rushbase worker engine and the `rushbase` command line interface."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "rushbase-core",
  "typer>=0.15",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "platformdirs>=4.3",
  "defusedxml>=0.7",
  "numpy>=2.1",
  "pillow>=11.0",
  "pillow-heif>=0.20",
  "rawpy>=0.23",
  "opencv-python-headless>=4.10",
  "scenedetect==0.6.6",
  "onnxruntime>=1.23",
  "tokenizers>=0.21",
  "mcp==2.3.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.23"]
nvml = ["nvidia-ml-py>=12"]

[dependency-groups]
sidecar = ["pyinstaller>=6.11"]

[project.scripts]
rushbase = "rushbase_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rushbase_worker"]

[tool.hatch.build.targets.wheel.force-include]
"binaries.lock.json" = "rushbase_worker/data/binaries.lock.json"
"models.lock.json" = "rushbase_worker/data/models.lock.json"
