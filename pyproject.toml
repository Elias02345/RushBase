[project]
name = "rushbase"
version = "0.0.0"
description = "Rushbase monorepo root (virtual; not published)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "server", "worker"]

[tool.uv.sources]
rushbase-core = { workspace = true }
rushbase-server = { workspace = true }
rushbase-worker = { workspace = true }

[dependency-groups]
dev = [
  "rushbase-core",
  "rushbase-server",
  "rushbase-worker",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "pillow>=11.0",
  "numpy>=2.1",
  "tifffile>=2024.9",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["core/src", "server/src", "worker/src", "core/tests", "server/tests", "worker/tests"]
extend-exclude = ["dev/library", "dev/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "ASYNC", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["SIM117", "S105", "S106", "S108", "S603", "S607"]
"dev/testmedia/*.py" = ["S603", "S607", "T201"]
"scripts/*.py" = ["S603", "S607", "T201", "S101"]
"scripts/perf/*.py" = ["S105", "RUF005", "ASYNC240", "S603", "S607", "T201", "S101", "S311", "S608", "E501", "RUF100"]
"worker/src/rushbase_worker/**" =["ASYNC109", "ASYNC240"]
"worker/scripts/*.py" = ["S603", "S607", "T201"]
"worker/tests/test_companion_*.py" = ["PT018", "S314", "RUF015", "ASYNC240", "E501"]
"worker/tests/companion_data.py" = ["E501"]
"worker/tests/fake_resolve/*.py" = ["E501", "N802"]
"worker/src/rushbase_worker/companion/**" = ["E501"]
"worker/src/rushbase_worker/cli_companion.py" = ["E501"]
"worker/src/rushbase_worker/companion/api.py" = ["S105", "E501"]
"worker/tests/fixtures/ai/*.py" = ["T201", "S101"]
"server/src/rushbase_server/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["core/src", "server/src", "worker/src", "server/tests", "worker/tests"]
explicit_package_bases = true
exclude = ["worker/tests/fixtures/ai/make_siglip_fixture.py"]
files = ["core/src", "server/src", "worker/src", "core/tests", "server/tests", "worker/tests", "dev/testmedia"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["core/tests", "server/tests", "worker/tests"]
pythonpath = ["server/tests", "worker/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "postgres: needs a reachable PostgreSQL (RUSHBASE_TEST_DATABASE_URL)",
  "models: needs downloaded AI models in the worker data dir",
  "gpu: needs a GPU, llama-server/whisper-cli and downloaded models",
]

[[tool.mypy.overrides]]
module = ["rawpy.*", "pillow_heif.*", "cv2.*", "scenedetect.*", "blake3.*", "defusedxml.*", "onnxruntime.*", "pynvml.*"]
ignore_missing_imports = true
implicit_reexport = true
