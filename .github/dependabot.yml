version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    target-branch: dev
