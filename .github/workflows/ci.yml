name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly sandbox run

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rushbase
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rushbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rushbase -d rushbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSHBASE_TEST_DATABASE_URL: postgresql+psycopg://rushbase:ci-only-password@127.0.0.1:5432/rushbase
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest
        run: uv run pytest --cov=core/src --cov=server/src --cov=worker/src --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm -r lint
      - name: Type check
        run: pnpm -r typecheck
      - name: Vitest
        run: pnpm -r test
      - name: Build
        run: pnpm --filter @rushbase/web build

  desktop-rust:
    # The Tauri shell: clippy and unit tests (the sidecar is a stub here; installers: desktop.yml).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Frontend build and sidecar stub (tauri-build validates both)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @rushbase/desktop build
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          printf '#!/bin/sh\nexit 2\n' > "desktop/src-tauri/binaries/rushbase-${triple}"
          chmod +x "desktop/src-tauri/binaries/rushbase-${triple}"
      - run: cargo fmt --check
        working-directory: desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - run: cargo test
        working-directory: desktop/src-tauri

  e2e:
    # Playwright against a production build served with the in-browser mock API.
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @rushbase/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @rushbase/web exec playwright install --with-deps chromium
      - name: Install system libraries (cached browsers)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @rushbase/web exec playwright install-deps chromium
      - name: Playwright
        run: pnpm --filter @rushbase/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:stable -x -s bash \
            install.sh update.sh revert-update.sh doctor.sh scripts/*.sh scripts/lib/*.sh deploy/test/guest-test.sh desktop/scripts/*.sh

  sandbox:
    # Full installer/updater/rollback/watchdog/doctor run inside a systemd container (slow).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Sandbox test
        run: scripts/sandbox-test.sh
