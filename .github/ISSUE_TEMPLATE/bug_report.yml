name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems: do not file them here, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rushbase version or commit
      description: "Output of `git rev-parse --short HEAD` in the checkout, or the version shown in the web UI."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        [
          Server,
          Worker / CLI,
          Web UI,
          Desktop companion,
          MCP / Claude,
          Installer / updater,
          Docs,
          Other,
        ]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15 ...
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: Deploy mode
      options:
        [
          Bare metal (systemd),
          Docker bridge,
          Docker host network,
          Development stack (make dev),
          Other,
        ]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and inference backend
      description: "Output of `rushbase hardware`, or CPU only."
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: "Run `sudo bash doctor.sh` on the server and/or `rushbase doctor` on the worker."
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens and internal hostnames first.
      render: text
